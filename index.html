<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech Stack Recommender</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--text:#1f2a24;--muted:#5f6f66;--accent:#2f7d5b;--bar:#dfe9e3;--border:#d5e0d9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b2620;--text:#e6efe9;--muted:#9bb0a4;--accent:#5fc496;--bar:#2a3a31;--border:#2f4137;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a16;--card:#1b2620;--text:#e6efe9;--muted:#9bb0a4;--accent:#5fc496;--bar:#2a3a31;--border:#2f4137;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input{width:100%;padding:11px 12px;font-size:1rem;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
button{margin-top:16px;width:100%;padding:12px;font-size:1rem;font-weight:600;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
.hint{font-size:.8rem;color:var(--muted);margin-top:10px}
#out{margin-top:20px}
.res{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;font-weight:600}
.bar{height:8px;border-radius:6px;background:var(--bar);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.skills{font-size:.8rem;color:var(--muted);margin-top:6px}
.msg{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>🧭 Tech Stack Recommender</h1>
<p class="sub">Enter 3 skills and get your Top 3 matching job roles. Built with TF-IDF and cosine similarity.</p>
<div class="card">
  <label for="s1">Skill 1</label><input id="s1" placeholder="e.g. python" autocomplete="off">
  <label for="s2">Skill 2</label><input id="s2" placeholder="e.g. aws" autocomplete="off">
  <label for="s3">Skill 3</label><input id="s3" placeholder="e.g. automation" autocomplete="off">
  <button id="go">Recommend roles</button>
  <div class="hint">Try single words like python, sql, aws, docker, linux, kotlin, figma.</div>
</div>
<div id="out"></div>
</main>
<script>
const DATA = [
"Data Scientist|python sql machine learning statistics data analysis pandas numpy",
"DevOps Engineer|aws docker kubernetes ci/cd automation linux python jenkins terraform",
"Backend Developer|java python sql apis databases spring django",
"Cloud Engineer|aws azure cloud computing networking automation terraform",
"Frontend Developer|html css javascript react ui design typescript",
"ML Engineer|python tensorflow machine learning deep learning math pytorch",
"System Admin|linux networking scripting security automation bash",
"Data Analyst|sql excel python visualization statistics tableau powerbi",
"Cybersecurity Analyst|security networking linux python cryptography",
"Full Stack Developer|javascript react nodejs sql apis html css mongodb",
"Mobile App Developer|kotlin swift android ios flutter apis firebase",
"Android Developer|kotlin java android apis firebase ui design",
"iOS Developer|swift ios xcode apis ui design",
"Data Engineer|python sql spark hadoop etl airflow aws databases",
"Database Administrator|sql databases mysql postgresql backup security performance",
"AI Engineer|python deep learning nlp tensorflow pytorch machine learning apis",
"NLP Engineer|python nlp machine learning deep learning transformers pytorch",
"Computer Vision Engineer|python opencv deep learning pytorch machine learning math",
"Software Tester|testing selenium automation python java sql qa",
"QA Automation Engineer|selenium automation testing python java ci/cd apis",
"UI UX Designer|figma design ui ux prototyping html css",
"Game Developer|c++ unity c# game design math graphics",
"Embedded Systems Engineer|c c++ embedded microcontrollers electronics iot linux",
"IoT Engineer|iot embedded python networking sensors cloud mqtt",
"Blockchain Developer|blockchain solidity javascript cryptography ethereum apis",
"Network Engineer|networking cisco routing security linux scripting",
"Site Reliability Engineer|linux kubernetes docker automation python monitoring aws",
"Product Analyst|sql excel statistics visualization tableau analysis python",
"Business Intelligence Developer|sql powerbi tableau etl visualization databases excel",
"Python Developer|python django flask apis sql git",
"Java Developer|java spring apis sql databases git",
"Web Developer|html css javascript php mysql apis",
"Cloud Architect|aws azure cloud computing networking security terraform kubernetes",
"Automation Engineer|automation python scripting selenium ci/cd bash"
].map(r=>{const [role,skills]=r.split("|");return {role,skills}});

// Same tokenizer as scikit-learn's default (words of 2+ characters, lowercase)
const tok = t => (t.toLowerCase().match(/\b\w\w+\b/g) || []);

// Build vocabulary + smooth IDF (same formula as TfidfVectorizer)
const docs = DATA.map(d=>tok(d.skills));
const vocab = [...new Set(docs.flat())];
const idx = Object.fromEntries(vocab.map((w,i)=>[w,i]));
const N = docs.length;
const idf = vocab.map(w=>Math.log((1+N)/(1+docs.filter(d=>d.includes(w)).length))+1);

function vec(tokens){
  const v = new Array(vocab.length).fill(0);
  tokens.forEach(t=>{ if(t in idx) v[idx[t]]++; });
  for(let i=0;i<v.length;i++) v[i]*=idf[i];
  const n = Math.sqrt(v.reduce((s,x)=>s+x*x,0));
  return n ? v.map(x=>x/n) : v;
}
const roleVecs = docs.map(vec);
const dot = (a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);

function recommend(skills){
  const u = vec(tok(skills.join(" ")));                      // Ingestion -> vector
  return DATA.map((d,i)=>({role:d.role,skills:d.skills,score:dot(u,roleVecs[i])})) // Scoring
    .sort((a,b)=>b.score-a.score)                            // Sorting
    .filter(r=>r.score>0).slice(0,3)                         // Filtering (Top 3)
    .map(r=>({...r,matched:[...new Set(tok(r.skills))].filter(w=>tok(skills.join(" ")).includes(w))})); // Why this match?
}

const out = document.getElementById("out");
document.getElementById("go").onclick = () => {
  const skills = ["s1","s2","s3"].map(id=>document.getElementById(id).value.trim());
  if (skills.some(s=>!s)) { out.innerHTML = '<p class="msg">Please fill in all 3 skills.</p>'; return; }
  const res = recommend(skills);
  if (!res.length) { out.innerHTML = '<p class="msg">No matching roles found. Try more common skills like python, sql, aws, docker, linux.</p>'; return; }
  out.innerHTML = '<h2 style="font-size:1.1rem">Top '+res.length+' Recommended Roles</h2>' + res.map((r,i)=>{
    const p = Math.round(r.score*100);
    return '<div class="res"><div class="row"><span>'+(i+1)+'. '+r.role+'</span><span>'+p+'% match</span></div>'
      +'<div class="bar"><i style="width:'+p+'%"></i></div><div class="skills">Why: matched on → '+r.matched.join(", ")+'</div><div class="skills">Role skills: '+r.skills+'</div></div>';
  }).join("");
};
document.querySelectorAll("input").forEach(el=>el.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("go").click(); }));
</script>
</body>
</html>
